# Logging Configuration
logging:
  version: 1
  disable_existing_loggers: false
  
  formatters:
    json:
      format: '{"timestamp": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "message": "%(message)s"}'
    simple:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
      
  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: simple
      stream: ext://sys.stdout
      
    file:
      class: logging.handlers.RotatingFileHandler
      level: DEBUG
      formatter: json
      filename: logs/tenderai.log
      maxBytes: 10485760  # 10MB
      backupCount: 5
      
  loggers:
    tenderai_bf:
      level: DEBUG
      handlers: [console, file]
      propagate: false
      
    httpx:
      level: WARNING
      handlers: [console]
      
    urllib3:
      level: WARNING
      handlers: [console]
      
  root:
    level: INFO
    handlers: [console]

# Monitoring and Metrics
monitoring:
  enable_metrics: true
  metrics_port: 8000
  health_check_endpoint: "/health"
  
  # Prometheus metrics (if using)
  prometheus:
    enabled: false
    port: 9090
    path: "/metrics"

# Security Settings
security:
  # JWT Authentication — TENDERAI_JWT_SECRET must be set in the environment.
  # No fallback is provided on purpose: missing/weak values are rejected at startup.
  jwt_secret_key: "${TENDERAI_JWT_SECRET}"
  jwt_algorithm: "HS256"
  jwt_access_token_expire_minutes: 1440  # 24 hours

  # Admin credentials (for initial setup - move to database later).
  # TENDERAI_ADMIN_PASSWORD must be set in the environment; no default fallback.
  admin_username: "${TENDERAI_ADMIN_USERNAME:-admin}"
  admin_password: "${TENDERAI_ADMIN_PASSWORD}"
  
  # Security limits
  max_file_size_mb: 100
  allowed_file_types: [".pdf", ".doc", ".docx", ".html", ".txt"]
  max_request_timeout: 60
  
  # User agent rotation (optional)
  rotate_user_agents: false
  user_agents:
    - "TenderAI-BF/1.0"
    - "Mozilla/5.0 (compatible; TenderAI-BF/1.0)"

# Development/Testing Settings
development:
  mock_external_apis: false
  save_debug_files: false
  debug_output_dir: "debug/"
  
  # Test data
  use_test_sources: false
  test_sources:
    - name: "Test Source"
      list_url: "https://www.arcop.bf/appels-doffres/"
      parser: "pdf"
      rate_limit: "1/s"