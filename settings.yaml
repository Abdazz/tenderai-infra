# TenderAI BF Configuration File
# Production-grade settings for multi-agent RFP harvester

# Application Settings
app_name: "${APP_NAME}"
app_version: "${APP_VERSION}"
environment: "${ENVIRONMENT}"  # Options: development, staging, production
debug: ${DEBUG}
log_level: "${LOG_LEVEL}"

# Database Configuration
database:
  url: "${TENDERAI_DATABASE_URL}"  # PostgreSQL connection string
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600

# Email Configuration
email:
  smtp_server: "${TENDERAI_SMTP_SERVER}"
  smtp_port: 587
  smtp_use_tls: true
  smtp_username: "${TENDERAI_SMTP_USERNAME}"
  smtp_password: "${TENDERAI_SMTP_PASSWORD}"
  from_address: "${TENDERAI_FROM_EMAIL}"
  to_address: "${TENDERAI_TO_EMAIL}"
  reply_to: "${TENDERAI_FROM_EMAIL}"
  
  # Email templates (French)
  subject_template: "🔍 TenderAI - Rapport d'appels d'offres {date}"
  body_template: |
    Bonjour,
    
    Veuillez trouver ci-joint le rapport des appels d'offres pour la date du {date}.
    
    Résumé :
    - {total_items} appels d'offres trouvés
    - {relevant_items} pertinents pour l'IT/Ingénierie
    - {urgent_items} avec échéances urgentes
    
    Cordialement,
    TenderAI BF

# Storage Configuration (MinIO/S3)
storage:
  endpoint_url: "${TENDERAI_STORAGE_ENDPOINT}"
  access_key: "${TENDERAI_STORAGE_ACCESS_KEY}"
  secret_key: "${TENDERAI_STORAGE_SECRET_KEY}"
  bucket_name: "${TENDERAI_STORAGE_BUCKET}"
  region: "us-east-1"
  use_ssl: true
  create_bucket: true

# Pipeline Configuration
pipeline:
  max_items_per_source: 100
  max_total_items: 500
  timeout_seconds: 3600  # 1 hour
  retry_attempts: 3
  retry_delay: 5
  
  # Rate limiting
  default_rate_limit: "10/m"  # 10 requests per minute
  # Compliance: honour robots.txt by default. Operators can flip this to
  # false locally for testing, but the default protects us from inadvertently
  # crawling pages the source explicitly disallows.
  respect_robots_txt: true
  user_agent: "TenderAI-BF/1.0 (+https://github.com/your-org/tenderai-bf)"

# Scheduler Configuration
scheduler:
  enabled: true
  timezone: "Africa/Ouagadougou"
  cron_schedule: "30 7 * * 1-5"  # 7:30 AM, Monday to Friday
  max_concurrent_runs: 1
  catch_up: false

# LangChain/LangGraph Configuration
langchain:
  # Default LLM settings (update with your provider)
  llm_provider: "openai"  # Options: openai, anthropic, azure_openai, groq, ollama
  model_name: "gpt-4o-mini"
  temperature: 0.1
  max_tokens: 1000
  api_key: "${LANGCHAIN_API_KEY}"
  
  # Ollama settings (for local LLM deployment)
  ollama_base_url: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"  # Ollama server endpoint
  ollama_model: "${OLLAMA_MODEL:-llama3.1}"  # Model name in Ollama (e.g., llama3.1, mistral, mixtral)
  
  # For Azure OpenAI (uncomment if using)
  # azure_endpoint: "${AZURE_OPENAI_ENDPOINT}"
  # azure_deployment: "${AZURE_OPENAI_DEPLOYMENT}"
  # api_version: "2024-02-01"

# Sources Configuration
sources:

  - name: "DGCMEF - Direction Générale du Contrôle des Marchés Publics"
    list_url: "https://www.dgcmef.gov.bf/fr/appels-d-offre"
    parser: "pdf_quotidien"  # Special parser for daily bulletin PDFs
    rate_limit: "5/m"
    enabled: false
    description: "Quotidiens des marchés publics (PDF bulletins)"
    # Specific settings for DGCMEF
    quotidien_settings:
      fetch_latest_only: true  # Only fetch the most recent bulletin
      table_selector: "table"  # CSS selector for the quotidien table
      title_column: 0  # First column contains the title
      pdf_column: 1    # Second column contains the PDF link

  - name: "DGCMEF RAG - PDF Quotidien avec RAG"
    list_url: "https://www.dgcmef.gov.bf/fr/appels-d-offre"
    parser: "pdf_rag"  # RAG-based parser for PDF extraction using Chroma + LLM
    rate_limit: "5/m"
    enabled: true
    description: "Quotidiens des marchés publics parsed with RAG system"
    # RAG-specific settings
    rag_settings:
      use_llm: true  # Use LLM for tender extraction
      chunk_size: 512
      top_k_results: 5
    quotidien_settings:
      fetch_latest_only: true
      table_selector: "table"
      title_column: 0
      pdf_column: 1

  - name: "Joffres.net - Page de Recherche"
    list_url: "https://joffres.net/recherche?domaine=Informatique+%26+D%C3%A9veloppement&localisation=&societe=&secteur=&prevision=0%2F1000000000&date_publication=&date_expiration=&statut="
    item_url_pattern: "https://www.joffres.net/appeloffre/{slug}"
    parser: "html-listing"  # HTML listing pages with detail links
    rate_limit: "10/m"
    enabled: true
    description: "Plateforme collaborative d'appels d'offres"
    joffres_settings:
      item_selector: ".tender-item, .appel-offre, [data-tender]"
      slug_attribute: "data-slug"
      title_selector: ".tender-title, h3"
      entity_selector: ".entity-name, .company"
      deadline_selector: ".deadline, .date-limite"

  - name: "Joffres.net - Appels d'Offres Publics"
    list_url: "https://www.joffres.net/appel-offres-publics"
    item_url_pattern: "https://www.joffres.net/appeloffre/{slug}"
    parser: "html-listing"  # HTML listing pages with detail links
    rate_limit: "10/m"
    enabled: false
    description: "Plateforme collaborative d'appels d'offres publics"
    joffres_settings:
      item_selector: ".tender-item, .appel-offre, [data-tender]"
      slug_attribute: "data-slug"
      title_selector: ".tender-title, h3"
      entity_selector: ".entity-name, .company"
      deadline_selector: ".deadline, .date-limite"

  - name: "Joffres.net - Appels d'Offres Privés"
    list_url: "https://www.joffres.net/appel-offres-priv%C3%A9s"
    item_url_pattern: "https://www.joffres.net/appeloffre/{slug}"
    parser: "html-listing"  # HTML listing pages with detail links
    rate_limit: "10/m"
    enabled: false
    description: "Plateforme collaborative d'appels d'offres privés"
    joffres_settings:
      item_selector: ".tender-item, .appel-offre, [data-tender]"
      slug_attribute: "data-slug"
      title_selector: ".tender-title, h3"
      entity_selector: ".entity-name, .company"
      deadline_selector: ".deadline, .date-limite"

  - name: "UNGM - UN Global Marketplace (Burkina Faso)"
    list_url: "https://www.ungm.org/Public/Notice/Search"
    parser: "ungm"
    rate_limit: "5/m"
    enabled: true
    description: "Avis de marchés ONU (PNUD, UNICEF, OMS, etc.) filtrés par pays Burkina Faso"
    ungm_settings:
      country_ids: [2324]   # 2324 = Burkina Faso
      page_size: 50

  - name: "Google Search - AO Burkina IT"
    list_url: "https://www.googleapis.com/customsearch/v1"
    parser: "google_search"
    rate_limit: "10/m"
    enabled: false
    description: "Recherche web Google pour appels d'offres IT au Burkina Faso"
    google_search_settings:
      queries:
        - '"appel d''offres" "Burkina Faso" informatique -résultats -attribution'
        - '"demande de prix" "Burkina Faso" informatique -résultats'
        - '"appel d''offres" "Burkina Faso" numérique cybersécurité'
        - '"appel d''offres" "Burkina Faso" réseau serveur logiciel'

