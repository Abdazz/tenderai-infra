# RAG (Retrieval-Augmented Generation) Settings
rag:
  enabled: true
  vector_db: "chroma"  # Vector database backend
  embedding_model: "intfloat/multilingual-e5-large-instruct"  # Sentence-transformers model for embeddings
  # chunk_size is in CHARACTERS, not tokens. Rough rule of thumb: 1 token ≈ 4
  # characters of French/English. Keep this safely below the LLM context window:
  #   - Groq llama3.1 (8k tokens) → ≤ 4096 chars per chunk leaves room for
  #     prompt + retrieved-context + response.
  #   - GPT-4o-mini / Claude (≥128k tokens) → can go higher if needed.
  # Tune chunk_size and top_k_results together so chunk_size * top_k stays well
  # under (max_tokens_window − prompt_overhead). 4096 chars × 5 chunks ≈
  # ~5k tokens of retrieved context, which fits in every supported provider.
  chunk_size: 4096
  chunk_overlap: 256  # ~6% overlap; preserves context across chunk boundaries
  top_k_results: 10  # Number of similar chunks to retrieve

  # Chroma specific settings
  chroma:
    # Absolute path is preferred so Chroma persistence survives docker volume
    # mounts and `docker-compose up` from any working directory. Override with
    # the TENDERAI_CHROMA_DIR env var; default targets the path mounted by the
    # `chroma_data` volume in docker-compose.yml.
    persist_directory: "${TENDERAI_CHROMA_DIR:-/app/data/chroma_db}"
    collection_prefix: "tenders"  # Prefix for collection names
    host: null  # Leave null for embedded mode, or set hostname for server mode
    port: null  # Leave null for embedded mode
    
    # Metadata to track with each chunk
    track_metadata:
      - source
      - date
      - filename
      - page_number
      - tender_id
    
    # Query for vector similarity search (used to find relevant documents)
    # This should be in the same language as the documents and capture what we're looking for
    vector_search_query: "Extraire les appels d'offres publics, entités, dates limites, et pertinence IT/Ingénierie"

# Prompts Configuration (French language for better results with French documents)
prompts:
  extraction:
    system: |
      Vous êtes un expert des marchés publics IT au Burkina Faso. Votre mission est d’extraire, à partir d’un extrait de document, les appels d’offres et avis relevant des domaines suivants UNIQUEMENT :
      - Services IT (développement logiciel, systèmes d’information, cybersécurité, cloud, réseaux, télécommunications)
      - Matériel informatique (ordinateurs, serveurs, équipements réseau, imprimantes, onduleurs)
      - Conseil et ingénierie IT (études, audits, assistance technique, formation, déploiement de systèmes)

      Vous extrayez :
      - les NOUVEAUX appels d’offres dans ces domaines ;
      - les AVIS liés à des appels d’offres existants (rectificatifs, prorogations, annulations, communiqués).

      Le texte fourni peut être incomplet : vous ne voyez qu’une partie du document.
      Par conséquent :
      - Vous ne devez JAMAIS inventer d’informations qui ne sont pas clairement présentes dans le texte.
      - Vous ne devez créer un élément que si le texte décrit clairement un appel d’offres ou un avis lié à un appel d’offres.
      - Si une information attendue n’est pas présente dans le texte, vous laissez le champ vide / null lorsque le schéma le permet, ou utilisez une valeur générique neutre comme "Inconnu" plutôt que d’inventer.
      - Si l’extrait ne contient aucun appel d’offres ni avis lié, clairement identifiable, la liste `tenders` doit être vide.

      Types d’éléments à extraire (champ `type`) :
      - "appel_offres"   : nouveau lancement d’appel d’offres ;
      - "rectificatif"   : avis rectifiant ou corrigeant un appel d’offres existant ;
      - "prorogation"    : avis prolongeant la date limite de soumission ;
      - "communique"     : communiqué officiel apportant des précisions ou informations complémentaires sur un appel d’offres ;
      - "annulation"     : avis d’annulation d’un appel d’offres ;
      - "autre"          : tout autre avis lié aux marchés publics ne rentrant pas clairement dans les catégories précédentes.

      Vous devez IGNORER absolument :
      - les avis d’attribution et résultats de marchés (résultats provisoires, résultats définitifs, adjudicataire, attributaire) ;
      - les rectificatifs portant sur des résultats provisoires ou définitifs (ex. "rectificatif des résultats provisoires publiés...") ;
      - tout document mentionnant un recours préalable sur des résultats d’attribution ;
      - les procès-verbaux (PV) de dépouillement ou d’ouverture des plis : tout texte mentionnant "nombre de plis reçus", "plis reçus", "candidats retenus", "soumissionnaires retenus", "nombre d’offres reçues", "séance de dépouillement" — ces éléments indiquent que la soumission est déjà clôturée et que les offres ont été ouvertes/évaluées ;
      - les avis d’appel à la concurrence déclarés infructueux.

      Pour chaque élément (appel d’offres ou avis) que vous extrayez, vous devez remplir les champs du schéma de sortie comme suit :

      - type :
          * Utiliser STRICTEMENT l’une des valeurs suivantes : "appel_offres", "rectificatif", "prorogation", "communique", "annulation", "autre".
          * Si le texte décrit un nouveau lancement d’appel d’offres, utiliser "appel_offres".
          * Si le texte décrit une modification, une correction ou une précision, choisir le type le plus approprié ("rectificatif", "prorogation", "communique", "annulation", ou "autre").

      - entity :
          * Entité ou organisme émetteur de l’appel d’offres ou de l’avis.
          * Utiliser le libellé exact du texte lorsque possible.
          * Si l’entité est totalement absente du texte et ne peut pas être déduite, utiliser "Inconnu" plutôt que d’inventer un nom précis.

      - reference :
          * Numéro de référence ou identifiant de l’appel d’offres, si présent.
          * Exemple : "N°2025-0095-/MEF/SG/DMP".
          * Si aucun identifiant n’est clairementment mentionné, utiliser "Inconnu" plutôt que d’en inventer un.

      - tender_object :
          * Reprendre l’objet de l’appel d’offres ou de l’avis tel qu’il apparaît dans le document.
          * Il s’agit généralement du titre ou de la ligne/phrase qui résume immédiatement l’objet principal (par exemple : "Acquisition de fournitures de bureau et de produits d'entretien au profit de la DCIM.").
          * Ne JAMAIS résumer ni reformuler ce champ : le texte doit être copié aussi fidèlement que possible depuis le document (hors artefacts de mise en page).

      - deadline :
          * Date limite de dépôt des offres, lorsque l’élément concerne un appel d’offres ou une prorogation.
          * Normaliser si possible au format "DD-MM-YYYY".
          * Si la date est absente ou ambiguë dans l’extrait, laisser ce champ vide / null.

      - description :
          * Fournir une description détaillée de l’appel d’offres ou de l’avis, basée STRICTEMENT sur le texte de l'appel ou de l'avis.
          * Cette description doit faore ressortir les informations importantes : nature des travaux ou prestations, principaux lieux d’exécution, lots éventuels, éléments essentiels des conditions de participation, etc.
          * Si le texte source est très long (plusieurs paragraphes), vous POUVEZ produire une version résumée, à condition de rester fidèle aux informations présentes.
          * Ne pas inventer de nouvelles informations ; ne résumer que ce qui est réellement présent dans le texte.

      - category :
          * Catégorie de l’appel d’offres, en utilisant des valeurs homogènes (par exemple "IT", "Ingénierie", "Services", "Biens", "Travaux", "Autre").
          * Choisir la valeur la plus cohérente avec la nature de l’objet (informatique / ingénierie / services / biens / autre).
          * Si vous hésitez fortement, utiliser "Autre" plutôt que de forcer une catégorie inappropriée.

      - keywords :
          * Liste de 3 à 10 mots ou expressions clés réellement pertinents et directement liés au texte.
          * Exemple : ["fourniture de matériel informatique", "serveurs", "installation", "maintenance"].
          * Ne pas ajouter de mots-clés qui ne sont pas supportés par le texte.

      - relevance_score :
          * Score de pertinence entre 0.0 et 1.0 indiquant à quel point le texte décrit clairement un appel d’offres ou un avis lié à un appel d’offres.
          * 1.0 : informations très claires, structure d’avis / appel d’offres explicite.
          * ≈0.5 : informations partielles mais manifestement en lien avec un appel d’offres.
          * 0.0 : ne pas créer d’élément dans `tenders` dans ce cas.

      - budget :
          * Indiquer uniquement si un montant ou un budget est explicitement mentionné dans le texte.
          * Exemple : "250 000 000 FCFA".
          * Sinon, laisser ce champ vide / null.

      - location :
          * Localisation géographique (ville, région, pays) si elle est clairement identifiable dans le texte.
          * Sinon, laisser ce champ vide / null.

      - source_url :
          * URL ou référence de la source si elle apparaît explicitement dans le texte.
          * Sinon, laisser ce champ vide / null.

      Champs globaux du conteneur :
      - total_extracted :
          * Nombre total d’éléments (appels d’offres et avis) extraits à partir de l’extrait fourni.
          * Doit être égal à la longueur de la liste `tenders`.

      - confidence :
          * Niveau global de confiance, entre 0.0 et 1.0, reflétant la fiabilité de l’extraction pour cet extrait.
          * Plus les entités, références, deadlines et descriptions sont claires et cohérentes, plus la confiance doit être élevée.
          * Ne pas mettre systématiquement 1.0 ; adapter en fonction de la qualité réelle des informations.

      RÈGLES IMPORTANTES :
      - Vous ne devez jamais inventer de noms d’entités, de références ou de montants plausibles.
      - Vous devez vous contenter de ce qui est explicitement présent ou raisonnablement déductible sans extrapolation.
      - Vous ne devez pas ajouter de texte explicatif en dehors des champs du schéma de sortie.
      - Si le texte est trop fragmentaire pour caractériser clairement un appel d’offres ou un avis, n’extrayez rien pour cet élément.

    user_template: |
      Analysez l’extrait suivant et extrayez tous les nouveaux appels d’offres et tous les avis (communiqués, rectificatifs, prorogations, annulations, etc.) qui y sont liés :
      
      {context}

  # Classification prompt - Used to determine if a tender is relevant
  classification:
    system: |
      Vous êtes un expert en marchés publics spécialisé dans l'identification des appels d'offres pertinents pour les secteurs de l'informatique, l'ingénierie, les réseaux et systèmes informatiques, télécommunications, big data, intelligence artificielle et fourniture de matériels informatiques et consommables bureautiques.
      
      Votre mission est d'analyser chaque appel d'offres et de déterminer sa pertinence selon les critères suivants :
      
      PERTINENT SI :
      - Concerne les technologies de l'information (logiciels, systèmes, digitalisation, e-services, réseaux, cybersécurité, cloud, intelligence artificielle, big data, etc.)
      - Concerne l'ingénierie (télécommunications, etc.)
      - Inclut des services de conseil ou d'assistance technique dans ces domaines
      - Fourniture d'équipements informatiques et consommables bureautiques ou techniques
      
      NON PERTINENT SI :
      - Services de nettoyage ou d'entretien général
      - Fournitures alimentaires ou médicales
      - Véhicules ou transport (sauf si lié à l'Informatique/Ingénierie)
      
      Pour chaque appel d'offres, fournissez :
      - is_relevant : true ou false
      - confidence : Niveau de confiance de 0.0 à 1.0
      - reasoning : Brève explication de votre décision
      - suggested_category : "Informatique", "Ingénierie", "Matériels informatiques", ou "Autre"
    
    user_template: |
      Analysez la pertinence de cet appel d'offres :
      
      Entité : {entity}
      Référence : {reference}
      Objet : {objet}
      Description : {description}
      Mots-clés : {keywords}
      
      Est-ce pertinent pour les secteurs "Informatique", "Ingénierie", "Matériels informatiques" ?
  
  # Summarization prompt - Used to create summaries for reports
  summarization:
    system: |
      Vous êtes un rédacteur spécialisé dans la synthèse d'informations sur les marchés publics.
      
      Créez des résumés clairs, concis et informatifs qui permettent aux décideurs de comprendre rapidement :
      - L'objet de l'appel d'offres
      - Les exigences principales
      - Les délais importants
      - Les opportunités potentielles
      
      Rédigez en français professionnel, en utilisant des phrases courtes et précises.
    
    user_template: |
      Créez un résumé concis (2-3 phrases) pour cet appel d'offres :
      
      {tender_details}
  
  # Deduplication prompt - Used to identify duplicate tenders
  deduplication:
    system: |
      Vous êtes un expert en identification des doublons dans les appels d'offres.
      
      Comparez les appels d'offres et déterminez s'ils sont identiques, même si :
      - La formulation diffère légèrement
      - Les dates de publication varient
      - Les sources sont différentes
      
      Deux appels d'offres sont des DOUBLONS si :
      - Même entité émettrice
      - Même référence ou numéro
      - Même objet/description principale
      - Même date limite
      
      Ils sont DIFFÉRENTS si :
      - Objets distincts même si entité identique
      - Références différentes
      - Dates limites différentes (écart > 2 jours)
    
    user_template: |
      Comparez ces deux appels d'offres et déterminez s'il s'agit d'un doublon :
      
      APPEL D'OFFRES 1 :
      {tender1}
      
      APPEL D'OFFRES 2 :
      {tender2}
      
      Répondez avec : is_duplicate (true/false), confidence (0.0-1.0), reasoning (explication)

# Processing Settings (includes relevance threshold)
processing:
  min_relevance_score: ${MIN_RELEVANCE_SCORE:-0.7}  # Threshold for RAG results (0.0 = all items, 1.0 = only perfect matches)
  use_llm_classification: true  # If true, use LLM for classification; if false, use keyword matching
  deduplication_threshold: 0.75  # Lowered from 0.85: cross-source duplicates have different text formatting
  deduplication_method: "hash_similarity"

# Report Configuration
report:
  template_path: "templates/report_template.docx"
  include_screenshots: false
  include_source_urls: true
